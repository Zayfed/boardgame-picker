[project]
name = "boardgame-picker"
version = "0.1.0"
description = "Подбор настольной игры по данным Тесеры"
requires-python = ">=3.11,<3.15"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "httpx>=0.27,<0.29",
    "requests>=2.32,<3",
    "python-telegram-bot>=22,<23",
    "snowballstemmer>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
